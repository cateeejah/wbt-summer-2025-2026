<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Task 05: Form Validation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            /* Flexbox to center the container */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .form-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            text-align: center;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            background-color: #0056b3;
            color: white;
            padding: 12px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            margin-top: 10px;
        }

        button:hover {
            background-color: #004494;
        }
    </style>
</head>

<body>

    <div class="form-container">
        <h2>User Validation</h2>
        <form id="validationForm" onsubmit="return validateForm()">

            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter Your Name">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter Your Email">
            </div>

            <button type="submit">Submit</button>
        </form>
    </div>

    <script>
        function validateForm() {
            let nameValue = document.getElementById("name").value;
            let emailValue = document.getElementById("email").value;

            if (nameValue.trim() === "") {
                alert("Validation Failed: Please enter your name.");
                return false;
            }

            if (emailValue.trim() === "") {
                alert("Validation Failed: Please enter your email address.");
                return false;
            }

            if (!emailValue.includes("@") || !emailValue.includes(".")) {
                alert("Validation Failed: Please enter a valid email address.");
                return false;
            }

            alert("Success! Form is valid and ready to be submitted.");
            return true;
        }
    </script>
</body>

</html>
