<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Account</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            box-sizing: border-box;
        }

        .header {
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #111827;
            margin: 0 0 4px 0;
        }

        .header p {
            font-size: 14px;
            color: #8da4d0;
            margin: 0;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: #1f2937;
        }

        .form-group input:not([type="radio"]) {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            color: #111827;
            box-sizing: border-box;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-group input:not([type="radio"]):focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .form-group input::placeholder {
            color: #9ca3af;
        }

        .date-input::placeholder {
            color: #8fa3c7 !important;
        }

        .date-input {
            color: #8fa3c7 !important;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            opacity: 1;
        }

        .radio-group-container {
            margin-bottom: 28px;
        }

        .radio-group-label {
            font-size: 13px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 12px;
            display: block;
        }

        .radio-options {
            display: flex;
            gap: 20px;
        }

        .radio-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .radio-item input[type="radio"] {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border: 1px solid #6b7280;
            border-radius: 50%;
            outline: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .radio-item input[type="radio"]:checked {
            border-color: #2563eb;
            border-width: 5px;
        }

        .radio-item span {
            font-size: 14px;
            color: #374151;
        }

        .actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 12px 16px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.2s ease;
        }

        .btn-submit {
            flex: 1;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
        }

        .btn-submit:hover {
            background-color: #1d4ed8;
        }

        .btn-reset {
            background-color: #ffffff;
            color: #111827;
            border: 1px solid #e5e7eb;
            padding: 12px 24px;
        }

        .btn-reset:hover {
            background-color: #f9fafb;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="header">
            <h1>Create your account</h1>
            <p>Join us in a couple of steps.</p>
        </div>

        <form>
            <div class="form-group">
                <label for="fullName">Full name</label>
                <input type="text" id="fullName" placeholder="Nabeeha Taiyeba">
            </div>

            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" placeholder="28">
            </div>

            <div class="form-group">
                <label for="dob">Date of birth</label>
                <input type="text" id="dob" class="date-input" placeholder="25/06/2026">
            </div>

            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" placeholder="nabeeha@example.com">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>

            <div class="radio-group-container">
                <span class="radio-group-label">Preferred contact</span>
                <div class="radio-options">
                    <label class="radio-item">
                        <input type="radio" name="contact" value="email" checked>
                        <span>Email</span>
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="contact" value="phone">
                        <span>Phone</span>
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="contact" value="sms">
                        <span>SMS</span>
                    </label>
                </div>
            </div>

            <div class="actions">
                <button type="button" class="btn btn-submit">Submit</button>
                <button type="reset" class="btn btn-reset">Reset</button>
            </div>
        </form>
    </div>

</body>

</html>
